# Configuración de Wally.
# Todos los valores son opcionales: lo que no se declare usa el default de
# common/config.py. Los pines siguen la numeración BCM de PLAN.md §4.5.

log_level = "INFO"

[mqtt]
host = "localhost"
port = 1883

[motion]
standby = 25
servo_left = 18
servo_right = 23

# Seguridad. No subir duty_cap sin releer PLAN.md §2: los motores FA-130 son
# de 3V nominales y el riel de potencia entrega 4.8V.
duty_cap = 0.60
watchdog_ms = 500

pwm_hz = 10000
control_hz = 50
ramp_up_per_s = 2.0
ramp_down_per_s = 6.0

[motion.left]
pwm = 12
in1 = 20
in2 = 21
invert = false

[motion.right]
pwm = 13
in1 = 16
in2 = 26
invert = false

# Si una oruga gira al revés, invertir aquí antes de recablear.

[[motion.rangefinders]]
name = "front"
trig = 4
echo = 17

[[motion.rangefinders]]
name = "left"
trig = 5
echo = 27

[[motion.rangefinders]]
name = "right"
trig = 6
echo = 22

[vision]
width = 640
height = 480
fps = 15.0
jpeg_quality = 80
# Ajustar según cómo quede fijada la cámara al chasis.
hflip = false
vflip = false

[face]
# Lienzo del pixel art. Se escala por el mayor factor entero que quepa en la
# pantalla: con 480x320 sale x3. Subirlo pierde el aspecto de píxel gordo.
logical_width = 160
logical_height = 106
fps = 30
window_scale = 3
blink_every_s = 4.0
blink_jitter_s = 2.5
# Sin actividad durante este tiempo, la cara se adormece.
sleepy_after_s = 90.0

[voice]
model = "assets/voices/es_ES-davefx-medium.onnx"
piper_bin = "piper"
player = "aplay"
# Evita que repita el mismo aviso mientras se acerca a una pared.
dedupe_window_s = 8.0
max_queue = 12

[net]
iface = "wlan0"
ap_ssid = "Wally-Setup"
# WPA2 exige 8 caracteres como mínimo. Cámbiala: con un AP abierto, la
# contraseña de tu wifi viajaría en claro durante la configuración.
ap_password = "wally1234"
boot_timeout_s = 30.0
# Tiempo sin red antes de volver al modo configuración. Generoso a propósito:
# un router reiniciándose no debe dejarte sin control. 0 lo desactiva.
fallback_after_s = 120.0
poll_s = 5.0

[web]
host = "0.0.0.0"
port = 8080
# El navegador manda el joystick a esta frecuencia. 20 Hz deja 10x de margen
# frente al watchdog de 500 ms: un microcorte de wifi no frena el robot.
control_hz = 20.0
telemetry_hz = 5.0
mjpeg_fps = 15.0
