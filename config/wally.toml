# Configuración de Wally.
# Todos los valores son opcionales: lo que no se declare usa el default de
# common/config.py. Los pines siguen la numeración BCM de PLAN.md §4.5.

log_level = "INFO"

[mqtt]
host = "localhost"
port = 1883

[motion]
# GPIO25/17 se los quedó la pantalla SPI MPI3201 (RST y touch IRQ, ver
# PLAN.md §3). GPIO18 sigue libre: esta pantalla no usa GPIO para backlight.
standby = 19
servo_left = 18
servo_right = 23

# Seguridad. No subir duty_cap sin releer PLAN.md §2: los motores FA-130 son
# de 3V nominales y el riel de potencia entrega 4.8V.
duty_cap = 0.60
watchdog_ms = 500

pwm_hz = 10000
control_hz = 50
ramp_up_per_s = 2.0
ramp_down_per_s = 6.0

[motion.left]
pwm = 12
in1 = 20
in2 = 21
invert = false

[motion.right]
pwm = 13
in1 = 16
in2 = 26
invert = false

# Si una oruga gira al revés, invertir aquí antes de recablear.

[[motion.rangefinders]]
name = "front"
trig = 4
echo = 15

[[motion.rangefinders]]
name = "left"
trig = 5
echo = 27

[[motion.rangefinders]]
name = "right"
trig = 6
echo = 22

[vision]
width = 640
height = 480
fps = 15.0
jpeg_quality = 80
# Ajustar según cómo quede fijada la cámara al chasis.
hflip = false
vflip = false

# Detección de objetos. Instalar con deploy/install_model.sh.
model = "models/efficientdet_lite0.tflite"
labels = "models/coco_labels.txt"
# Muy por debajo de la captura: detectar cuesta ~100 ms en una Pi 4 y no hace
# falta más para reaccionar a un gato. Subirlo se come la CPU del vídeo y el
# control de motores.
inference_fps = 5.0
min_score = 0.45
threads = 4
draw_overlay = true

# Qué se sigue con histéresis. 'cat' de COCO basta: no hay otros gatos en casa.
track_label = "cat"
# Asimétrico a propósito: aparecer exige poca evidencia, desaparecer mucha.
appear_hits = 3
disappear_misses = 12

[brain]
# ⚠️ ESTAS CONSTANTES SON ESTIMACIONES DE PARTIDA.
# Dependen de cómo responda el chasis real: cuánto derrapan las orugas, cuánto
# tarda en frenar, qué ángulo gira por segundo. Hay que afinarlas con el robot
# montado, en el suelo definitivo y con la batería cargada.
start_mode = "idle"
update_hz = 10.0

# Patrulla
cruise_speed = 0.55
turn_speed = 0.6
backup_speed = 0.45
stop_mm = 320.0        # a esta distancia deja de avanzar y gira
backup_mm = 160.0      # tan cerca que girar rozaría: primero retrocede
clear_mm = 500.0       # espacio necesario para dar el frente por despejado
backup_s = 0.9
turn_min_s = 0.5       # giro mínimo; sin esto vibra contra la pared
turn_timeout_s = 3.5   # girando más de esto, se asume encerrado

# Seguir a la gata. Despacio a propósito: el ultrasonido no detecta pelaje,
# así que el robot no puede "verla" con los sensores de distancia.
follow_speed = 0.35
follow_turn_speed = 0.42
follow_stop_area = 0.18   # fracción del encuadre a partir de la cual para
follow_align_tol = 0.35
follow_steer_gain = 0.5
cat_patience_s = 6.0
patrol_when_no_cat = true
follow_cat_while_patrolling = true

# Un comando de conducción ajeno silencia a brain este tiempo: mueves el
# joystick y el robot obedece sin cambiar de modo a mano.
manual_override_s = 3.0
announce_cat = true
cat_greeting = "¡Hola, gatita!"

[face]
# Lienzo del pixel art. Se escala por el mayor factor entero que quepa en la
# pantalla: con 320x240 (3.2" SPI) sale x2 exacto, sin franjas negras.
logical_width = 160
logical_height = 120
fps = 30
window_scale = 2
blink_every_s = 4.0
blink_jitter_s = 2.5
# Sin actividad durante este tiempo, la cara se adormece.
sleepy_after_s = 90.0

# Framebuffer SPI (MPI3201, instalada con goodtft/LCD-show), no HDMI/DRM.
# LCD-show suele remapear la consola a /dev/fb0, no /dev/fb1 — confirmar con
# `ls /dev/fb*` tras instalar (README C10) y ajustar si el device real es otro.
sdl_video_driver = "fbcon"
fb_device = "/dev/fb0"

# Gestos táctiles: no requieren calibración de coordenadas, solo miden
# cuánto duró el toque.
touch_tap_max_s = 0.6
touch_hold_s = 3.0

[voice]
model = "assets/voices/es_ES-davefx-medium.onnx"
piper_bin = "piper"
player = "aplay"
# Evita que repita el mismo aviso mientras se acerca a una pared.
dedupe_window_s = 8.0
max_queue = 12

[net]
iface = "wlan0"
ap_ssid = "Wally-Setup"
# WPA2 exige 8 caracteres como mínimo. Cámbiala: con un AP abierto, la
# contraseña de tu wifi viajaría en claro durante la configuración.
ap_password = "wally1234"
boot_timeout_s = 30.0
# Tiempo sin red antes de volver al modo configuración. Generoso a propósito:
# un router reiniciándose no debe dejarte sin control. 0 lo desactiva.
fallback_after_s = 120.0
poll_s = 5.0

[web]
host = "0.0.0.0"
port = 8080
# El navegador manda el joystick a esta frecuencia. 20 Hz deja 10x de margen
# frente al watchdog de 500 ms: un microcorte de wifi no frena el robot.
control_hz = 20.0
telemetry_hz = 5.0
mjpeg_fps = 15.0
