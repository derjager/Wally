[project]
name = "wally"
version = "0.1.0"
description = "Robot de orugas sobre Raspberry Pi 4"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pillow>=10.0",
    # Los frames viajan como arrays: la inferencia necesita píxeles crudos y
    # el overlay se dibuja antes de comprimir.
    "numpy>=1.24",
    # pygame-ce en lugar de pygame: mismo API (`import pygame`), pero es el
    # fork mantenido y publica wheels para las versiones nuevas de Python.
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
# Solo instalable en la Raspberry Pi. En el equipo de desarrollo se trabaja con --sim.
# picamera2 se instala con apt (python3-picamera2), no con pip.
pi = ["pigpio>=1.78"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "services.brain",
    "common",
    "services",
    "services.motion",
    "services.vision",
    "services.web",
    "services.net",
    "services.face",
    "services.voice",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
